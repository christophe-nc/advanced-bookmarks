advancedbookmarks.page.home.title=Mes favoris
advancedbookmarks.page.home.help=Ajoutez une page avec l’étoile de sa barre d’actions. Glissez-déposez pour classer vos favoris, ou utilisez les flèches et la liste « Déplacer vers ». Cochez « Panel » pour choisir les favoris affichés dans le panel, dans la limite fixée par l’administrateur (10 par défaut) ; sans sélection, le panel affiche les premiers. « Exporter » enregistre vos favoris dans un fichier, qu’« Importer » permet d’ajouter à vos favoris ou de restaurer. Vos favoris sont aussi accessibles dans l’onglet « Favoris » de votre profil.

