admin.advancedbookmarks=Advanced Bookmarks
admin.advancedbookmarks.description=Taille du panel, étoile et pages exclues des favoris.
advancedbookmarks.admin.heading=Favoris
advancedbookmarks.admin.help=Ces réglages ne concernent que le wiki courant. Quand l’étoile est masquée, les utilisateurs ne peuvent ajouter des favoris que par l’import d’un fichier. Les pages de l’extension elle-même ne peuvent jamais être ajoutées aux favoris.
AdvancedBookmarks.Code.ConfigurationClass_panelLimit=Taille du panel
AdvancedBookmarks.Code.ConfigurationClass_panelLimit.hint=Nombre maximal de favoris affichés dans le panel, de 1 à 20 (10 par défaut). Quand il est abaissé, les panels sont aussitôt raccourcis, et les sélections en trop sont retirées au prochain enregistrement des favoris de chaque utilisateur.
AdvancedBookmarks.Code.ConfigurationClass_starEnabled=Afficher l’étoile
AdvancedBookmarks.Code.ConfigurationClass_starEnabled.hint=Affiche le bouton étoile dans la barre d’actions des pages, pour ajouter une page aux favoris ou l’en retirer.
AdvancedBookmarks.Code.ConfigurationClass_excludedPages=Pages exclues
AdvancedBookmarks.Code.ConfigurationClass_excludedPages.hint=Pages qui ne peuvent pas être ajoutées aux favoris, ni par l’étoile ni par un import. Choisir la page d’accueil d’un espace (par exemple Main.Archives.WebHome) exclut aussi toutes ses pages enfants. Les favoris existants vers ces pages sont conservés.
