advancedbookmarks.page.home.title=My bookmarks
advancedbookmarks.page.home.help=Add a page with the star of its action bar. Drag and drop to organize your bookmarks, or use the arrows and the “Move to” list. Select “Panel” for the bookmarks to display in the panel, up to the limit set by the administrator (10 by default); without any selection, the panel displays the first ones. “Export” saves your bookmarks to a file, which “Import” adds to your bookmarks or restores. Your bookmarks are also available in the “Bookmarks” tab of your profile.

