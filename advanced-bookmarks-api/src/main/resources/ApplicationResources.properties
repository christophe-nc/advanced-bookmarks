advancedbookmarks.admin.tools.storeUnavailable=The bookmark storage (Solr core “advancedbookmarks”) is not available: bookmarks can be neither displayed nor modified. The cause is in the server log.
advancedbookmarks.admin.tools.transferHeading=Export and import of all the bookmarks
advancedbookmarks.admin.tools.transferHelp=“Export all the bookmarks” saves the bookmarks of all the users of this wiki to a single file, for instance as a backup. “Import” restores such a file user by user, in the background; users of the file who do not exist in this wiki are skipped. A file holds up to 10,000 users and 32 MB.
