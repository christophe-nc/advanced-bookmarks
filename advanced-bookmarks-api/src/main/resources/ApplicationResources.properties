admin.advancedbookmarks=Advanced Bookmarks
admin.advancedbookmarks.description=Panel size, star, pages that may not be bookmarked, storage status, export and import of all the bookmarks.
advancedbookmarks.admin.heading=Bookmarks
advancedbookmarks.admin.help=These settings apply to the current wiki only. When the star is hidden, users can only add bookmarks by importing a file. The pages of the extension itself can never be bookmarked.
AdvancedBookmarks.Code.ConfigurationClass_panelLimit=Panel size
AdvancedBookmarks.Code.ConfigurationClass_panelLimit.hint=Maximum number of bookmarks displayed in the panel, from 1 to 20 (10 by default). When it is lowered, the panels are shortened at once, and the extra selections are removed the next time each user saves their bookmarks.
AdvancedBookmarks.Code.ConfigurationClass_starEnabled=Display the star
AdvancedBookmarks.Code.ConfigurationClass_starEnabled.hint=Display the star button in the action bar of the pages, to add or remove a page from the bookmarks.
AdvancedBookmarks.Code.ConfigurationClass_excludedPages=Excluded pages
AdvancedBookmarks.Code.ConfigurationClass_excludedPages.hint=Pages that may not be added to the bookmarks, with the star or by an import. Selecting the home page of a space (such as Main.Archives.WebHome) also excludes all its child pages. Existing bookmarks of these pages are kept.
